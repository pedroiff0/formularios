name: Test builds

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure scripts are executable
        run: |
          chmod +x scripts/build_chapter.sh || true

      - name: Install TeX and prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended texlive-xetex make

      - name: Show environment & make version
        run: |
          echo "USER: $(whoami)"; pwd; ls -la scripts || true; ls -la calculos || true; pdflatex --version || true; make --version

      - name: Debug single chapter build (verbose)
        env:
          VERBOSE: 1
        run: |
          set -o pipefail -x
          echo "Testing build_chapter.sh calculoi calculo_basico";
          ./scripts/build_chapter.sh calculoi calculo_basico || {
            echo "Build failed. Listing calculos/calculoi:"; ls -la calculos/calculoi || true;
            echo "Listing logs:"; ls -la calculos/calculoi/*.log || true;
            for f in calculos/calculoi/*.log; do echo "==== $f ===="; tail -n 200 "$f" || true; done;
            exit 1;
          }

      - name: Build per-chapter PDFs (disciplines)
        env:
          VERBOSE: 1
        run: |
          # Build calculos and fisicas chapters individually
          make disciplines=calculos,fisicas VERBOSE=1

      - name: Build combined PDF
        env:
          VERBOSE: 1
        run: |
          make combined VERBOSE=1

      - name: List generated PDFs
        run: |
          echo "--- PDFs ---"
          find . -type f -name '*.pdf' -maxdepth 4 -print || true

      - name: Upload PDFs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-pdfs
          path: |
            combined.pdf
            main.pdf
            calculos/**/*.pdf
            fisicas/**/*.pdf
